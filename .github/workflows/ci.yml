name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conteiners_db
          POSTGRES_USER: conteiners_user
          POSTGRES_PASSWORD: conteiners_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conteiners_user -d conteiners_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: conteiners_db
      POSTGRES_USER: conteiners_user
      POSTGRES_PASSWORD: conteiners_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Ruff check
        run: ruff check .
        working-directory: backend

      - name: Ruff format
        run: ruff format --check .
        working-directory: backend

      - name: Mypy
        run: mypy .
        working-directory: backend

      - name: Pytest with coverage
        run: pytest --cov=. --cov-report=xml
        working-directory: backend

      - name: Import linter
        run: lint-imports --config importlinter.ini
        working-directory: backend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript build
        run: npm run build
        working-directory: frontend

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  promote:
    name: Promote to main
    runs-on: ubuntu-latest
    needs: [backend, frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote dev to main
        run: git push origin origin/dev:main --force-with-lease
