services:
  backend:
    build:
      context: ./backend
      target: dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app:cached
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conteiners_db}
      POSTGRES_USER: ${POSTGRES_USER:-conteiners_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conteiners_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-random-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data:delegated
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conteiners_db}
      POSTGRES_USER: ${POSTGRES_USER:-conteiners_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conteiners_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conteiners_user} -d ${POSTGRES_DB:-conteiners_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
