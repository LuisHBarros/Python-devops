[importlinter]
root_packages =
    config
    users
include_external_packages = True

[importlinter:contract:layers]
name = Layered architecture
type = layers
layers =
    users
    config

[importlinter:contract:forbidden-users-imports]
name = Users must not import from config directly
type = forbidden
source_modules =
    users
forbidden_modules =
    config
